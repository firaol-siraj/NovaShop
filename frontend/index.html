<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#231E1B" />
    <meta name="description" content="NovaShop — Premium minimalist fashion. New Arrivals, Collections, and Seasonal Essentials." />
    <title>NovaShop — Warm Editorial Minimalism</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('novashop-theme') || 'system';
          var theme = saved;
          if (saved === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-preference', saved);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
